[package]
name = "cloudfile-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
uuid.workspace = true
tempfile.workspace = true
fs2.workspace = true
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
open = "5"

p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
zeroize = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
# GetDriveTypeW：判断某块盘是不是固定本地盘（镜像根不能落在光驱/可移动盘/网络共享上）。
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Foundation"] }

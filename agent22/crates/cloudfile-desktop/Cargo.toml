[package]
name = "cloudfile-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
cloudfile-core = { path = "../cloudfile-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `macos-private-api` is required by the transparent float/toast windows and is
# a no-op on Windows/Linux (the feature only forwards to an empty flag).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudFile 任务中心</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="brand">◈ CloudFile</div><div class="badge">AGENT 2.2 · 开发版</div><nav>本地任务</nav><p>文件留在本机。<br>任务随时可见。</p></aside><main><header><div><small>工作区</small><h1>本地任务</h1></div><button id="refresh">刷新任务</button></header><div class="notice">普通本地编辑：在本地应用保存后，Agent 会在文件内容稳定后自动上传，可暂停或点击“保存云端”立即提交。独占编辑：从网页发起后由 Agent 领取 Checkout 租约，由你点击“提交”保留 Checkout，或“签入并释放”结束本次独占；提交结果未确认前不会自动重发，本地文件始终保留。两种模式每次最多 128 MiB。</div><section id="tasks" aria-live="polite"></section><section class="settings"><h2>受信任的 CloudFile 服务</h2><p>仅允许这些服务发起文件会话。请确认地址属于你的组织。</p><form id="trust"><input id="origin" type="url" required placeholder="https://files.example.com" aria-label="CloudFile 服务地址"><button>添加服务</button></form><ul id="origins"></ul></section><p id="message" role="status"></p></main><script src="app.js"></script></body></html>

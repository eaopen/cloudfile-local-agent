[workspace]
resolver = "2"
members = ["crates/cloudfile-core", "crates/cloudfile-native-host", "crates/cloudfile-desktop"]
default-members = ["crates/cloudfile-core", "crates/cloudfile-native-host"]

[workspace.package]
version = "2.2.0-alpha.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fs2 = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
